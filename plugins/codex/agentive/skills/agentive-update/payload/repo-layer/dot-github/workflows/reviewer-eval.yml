# agentive-unit: rl.ci.reviewer-eval
# design: spec.review_pipeline.reviewer_eval.ci, spec.review_pipeline.reviewer_eval.reviewer_paths, spec.repo_layer.files[f-ci], spec.outer_loop.triggers
# Not a required check and never blocks. Runs its comparison only on a PR that changes the reviewer (prompt, model,
# tool or review rule): N = 3 runs with the base branch's reviewer config (before) and 3 with the PR's (after), then one
# PR comment marked <!-- agentive-reviewer-eval --> updated in place. No schedule (decision G2, RVEVAL).
# Fork PRs of public repos get no secrets: the comment says 'not run'.
name: reviewer-eval
"on":
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  reviewer-eval:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 180
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: .agents/bin/agentive-reviewer-eval detect --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: install Claude Code
        if: steps.detect.outputs.changed == 'true' && env.HAS_KEY == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: before and after runs (headless standard command, never --bare)
        if: steps.detect.outputs.changed == 'true' && env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          .agents/bin/agentive-reviewer-eval run --side baseline --config-ref "$BASE_SHA" --n 3 --out "$RUNNER_TEMP/eval"
          .agents/bin/agentive-reviewer-eval run --side candidate --config-ref "$HEAD_SHA" --n 3 --out "$RUNNER_TEMP/eval"
      - name: score and comment
        if: steps.detect.outputs.changed == 'true'
        run: |
          if [ "$HAS_KEY" = "true" ]; then nr=""; else nr="--not-run"; fi
          .agents/bin/agentive-reviewer-eval score --out "$RUNNER_TEMP/eval" --baseline-ref "$BASE_SHA" --candidate-ref "$HEAD_SHA" --n 3 $nr
          .agents/bin/agentive-reviewer-eval comment "${{ github.event.pull_request.number }}" --file "$RUNNER_TEMP/eval/comment.md"
