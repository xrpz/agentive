[project]
name = "fixture-py"
version = "1.0.0"
description = "agentive self-test fixture: Python package"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
